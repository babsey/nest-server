[project]
name = "nest-server"
version = "3.0.0b9"
description = "A Python-based API server for the NEST Simulator"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [
  {name = "Sebastian Spreizer"},
  {name = "Jochen Eppler"},
  {name = "Dennis Terhorst"},
]
maintainers = [
  {name = "Sebastian Spreizer", email = "spreizer@web.de"},
]
keywords = ["NEST", "simulation", "spiking neuronal networks"]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",

  # Indicate who your project is intended for
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",

  "Topic :: Education",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "click>=8.5",
  "flask>=3.1",
  "flask-cors>=6.0",
  "gunicorn>=26.2",
  "nest-simulator>=3.10",
  "restrictedpython>=8.5",
]

[project.scripts]
nest-server = "nest_server.cli:main"
nest-server-mpi = "nest_server.mpi.cli:main"

[project.urls]
homepage = "https://github.com/nest/nest-server"
repository = "https://github.com/nest/nest-server"
documentation = "https://nest-simulator.readthedocs.io"

[project.optional-dependencies]
mpi = [
  "docopt>=0.6",
  "mpi4py>=4.1",
]

[dependency-groups]
dev = [
  "coverage>=7.16",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "ruff>=0.16",
  "ty>=0.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.coverage.run]
omit = [
  "cli.py",
  "runner.py",
]

[tool.ruff]
# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"
