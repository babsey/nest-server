[project]
name = "nest-server"
version = "3.0.0b1"
description = "A server instance for NEST Simulator"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
authors = [
  {name = "Sebastian Spreizer", email = "spreizer@web.de"},
]
maintainers = [
  {name = "Sebastian Spreizer", email = "spreizer@web.de"},
]
keywords = ["NEST", "simulation", "spiking neuronal networks"]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",

  # Indicate who your project is intended for
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",

  "Topic :: Education",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
#dependencies = [
#  "flask>=3.1",
#  "flask-cors>=6.0",
#  "gunicorn>=26.0",
#  "nest-simulator>=3.10",
#  "restrictedpython>=8.3",
#]
dynamic = ["dependencies"]

[project.urls]
homepage = "https://github.com/nest/nest-server"
repository = "https://github.com/nest/nest-server"
documentation = "https://nest-simulator.readthedocs.io"

[tool.setuptools]
script-files = ["scripts/nest-server"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 120

[tool.flake8]
# This is ignored
# see discussions around https://github.com/PyCQA/flake8/issues/234

[tool.isort]
atomic = true
line_length = 120
multi_line_output = 3
profile = "black"
skip_gitignore = true

[dependency-groups]
dev = [
    "black[jupyter]>=26.5.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
]
