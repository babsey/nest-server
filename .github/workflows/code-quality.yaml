name: Code quality
on: push

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    needs: setup-ruff
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0

  ruff-format:
    runs-on: ubuntu-latest
    needs: setup-ruff
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check
