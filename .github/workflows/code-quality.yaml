name: Code quality
on: push

jobs:
  setup-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip" # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

  ruff-check:
    runs-on: ubuntu-latest
    needs: setup-ruff
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4

  ruff-format:
    runs-on: ubuntu-latest
    needs: setup-ruff
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          args: format --check
