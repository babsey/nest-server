name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup-uv:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Minimize uv cache
        run: uv cache prune --ci

  lint:
    runs-on: ubuntu-latest
    needs: [setup-uv]
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Check code lints with Ruff
        run: make lint

      - name: Minimize uv cache
        run: uv cache prune --ci

  format:
    runs-on: ubuntu-latest
    needs: [setup-uv]
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Check code formats with Ruff
        run: make format

      - name: Minimize uv cache
        run: uv cache prune --ci

  pytest-cov:
    runs-on: ubuntu-latest
    needs: [lint, format]
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Run pytest with coverage
        run: make test-cov

      - name: Minimize uv cache
        run: uv cache prune --ci

  pytest-all:
    runs-on: ubuntu-latest
    needs: [lint, format]
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Run pytest for multiple python versions
        run: make test-all

      - name: Minimize uv cache
        run: uv cache prune --ci
